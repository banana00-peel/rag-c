[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roborock-rag"
version = "0.1.0"
description = "面向实习简历展示的 Roborock 石头中文说明书 RAG 项目。"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0.20",
    "fastapi>=0.116.0",
    "jieba>=0.42.1",
    "langchain-openai>=0.3.30",
    "langchain-text-splitters>=0.3.9",
    "langgraph>=0.6.6",
    "pydantic-settings>=2.10.0",
    "pymupdf>=1.26.0",
    "pytest>=8.3.0",
    "python-multipart>=0.0.20",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.43",
    "uvicorn[standard]>=0.35.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"


